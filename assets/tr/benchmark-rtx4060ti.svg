  <rect x="270" y="144" width="210" height="26" rx="6" fill="#38bdf8"/>
  <text x="490" y="162" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="800">52.5 tok/s • %100 GPU (5.03 GB)</text>

  <!-- Bar 3: qwen3.5:9b @ 8192 -->
  <text x="40" y="212" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen3.5:9b (ctx=8192)</text>
  <rect x="270" y="194" width="176" height="26" rx="6" fill="#a855f7"/>
  <text x="456" y="212" fill="#c084fc" font-family="Consolas, monospace" font-size="13" font-weight="800">44.0 tok/s • %100 GPU (5.62 GB)</text>

  <!-- Bar 4: qwen3.5:9b @ 16384 (Spill Warning) -->
  <text x="40" y="262" fill="#94a3b8" font-family="Consolas, monospace" font-size="13">qwen3.5:9b (ctx=16384)</text>
  <rect x="270" y="244" width="128" height="26" rx="6" fill="#ef4444" opacity="0.8"/>
  <text x="408" y="262" fill="#f87171" font-family="Consolas, monospace" font-size="12.5" font-weight="700">32.2 tok/s • %85.5 GPU (CPU'ya Taştı — Engellendi)</text>

  <rect x="40" y="294" width="540" height="42" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="56" y="320" fill="#94a3b8" font-family="Consolas, monospace" font-size="11.5">✓ Motor her GPU'da `probe_models` ile CPU taşmasını otomatik önler.</text>

  <!-- Divider -->
  <line x1="615" y1="30" x2="615" y2="330" stroke="#1e293b" stroke-width="2"/>

  <!-- Right Panel: Cloud Quota Consumption Comparison -->
  <text x="645" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="800">GERÇEK ÖLÇÜM 2: 4 PARÇALIK ÖZELLİKTE BULUT KOTASI</text>
  <text x="645" y="64" fill="#64748b" font-family="Consolas, monospace" font-size="12">Dosya tarama + 4 fonksiyon yaması + pytest doğrulama + 2 hata tamiri</text>

  <!-- Mode 1: Classic Cloud Agent -->
  <rect x="645" y="92" width="515" height="68" rx="10" fill="#1a1118" stroke="#ef4444" stroke-width="1.2"/>
