  <text x="665" y="142" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">18 Bulut Turu • ~46.000 Bulut Tokenı (%100 Kota Yakar)</text>
  <rect x="1030" y="106" width="110" height="36" rx="6" fill="#7f1d1d"/>
  <text x="1046" y="129" fill="#fecaca" font-family="Consolas, monospace" font-size="13" font-weight="800">%100 KOTA</text>

