  <text x="40" y="64" fill="#64748b" font-family="Consolas, monospace" font-size="12">Ollama 0.40.16 • Flash Attention = ON • KV Cache = q8_0</text>

  <!-- Bar 1: qwen3.5:4b -->
  <text x="40" y="112" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen3.5:4b (ctx=16384)</text>
  <rect x="270" y="94" width="284" height="26" rx="6" fill="#10b981"/>
  <text x="564" y="112" fill="#10b981" font-family="Consolas, monospace" font-size="13" font-weight="800">71.0 tok/s • %100 GPU (3.44 GB)</text>

  <!-- Bar 2: qwen2.5-coder:7b -->
