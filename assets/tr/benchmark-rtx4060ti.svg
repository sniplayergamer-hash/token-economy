  <rect x="1030" y="190" width="110" height="36" rx="6" fill="#065f46"/>
  <text x="1044" y="213" fill="#a7f3d0" font-family="Consolas, monospace" font-size="13" font-weight="800">-%91 KOTA</text>

  <!-- Mode 3: Token Economy Sidecar 0-Quota -->
  <rect x="645" y="260" width="515" height="76" rx="10" fill="#0c192c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="665" y="286" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">TOKEN ECONOMY — SAĞ PANEL DOĞRUDAN MOD</text>
  <text x="665" y="310" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">0 Bulut Turu • Tüm okuma/yama/test yerel GPU'da biter</text>
  <rect x="1030" y="278" width="110" height="36" rx="6" fill="#0369a1"/>
  <text x="1050" y="301" fill="#e0f2fe" font-family="Consolas, monospace" font-size="13" font-weight="800">%0 KOTA</text>
</svg>
