<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <rect width="1200" height="360" rx="16" fill="#070a10" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Panel: RTX 4060 Ti 8GB Empirical Speed & GPU Fit -->
