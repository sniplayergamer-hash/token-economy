  <text x="675" y="426" fill="#f8fafc" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen2.5-coder:7b (16K • 52.5 tok/s)</text>
  <text x="955" y="426" fill="#c084fc" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen3.5:9b (8K • 44 tok/s)</text>
