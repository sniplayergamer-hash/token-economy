  <rect width="1200" height="470" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">ARCHITECTURE: ATHLETE BRAIN + DETERMINISTIC ENGINE + APPRENTICE HAND</text>
  <text x="40" y="64" fill="#64748b" font-family="Consolas, monospace" font-size="12">Small models never juggle complex tool-calling loops; deterministic Python executes all tools &amp; verifiers.</text>

  <rect x="40" y="90" width="340" height="105" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="118" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">1. ATHLETE BRAIN (ANTIGRAVITY / IDE)</text>
  <text x="60" y="142" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• Maps symbols &amp; slices task in 1 turn</text>
  <text x="60" y="162" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• Dispatches Part 1..N batch in a single MCP call</text>
  <text x="60" y="182" fill="#10b981" font-family="Consolas, monospace" font-size="12">• Spends 2 short cloud turns instead of 20</text>

  <rect x="430" y="90" width="340" height="105" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="118" fill="#10b981" font-family="Consolas, monospace" font-size="13" font-weight="700">2. RIGHT-PANE COCKPIT (SIDECAR UI)</text>
  <text x="450" y="142" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• 0% Cloud Quota direct local coding mode</text>
  <text x="450" y="162" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• Live SSE code, diff, test, VRAM &amp; tok/s</text>
  <text x="450" y="182" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">• Saver ↔ Lab Mode • Stop / Instant Undo</text>

  <rect x="820" y="90" width="340" height="105" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="840" y="118" fill="#f59e0b" font-family="Consolas, monospace" font-size="13" font-weight="700">3. TERMINAL CLI &amp; BENCHMARK</text>
  <text x="840" y="142" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• Zero-latency control of the live daemon</text>
  <text x="840" y="162" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">• 3-Model Auto-Race (4b vs 7b vs 9b)</text>
  <text x="840" y="182" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">• py cli.py run | inspect | bench | rollback</text>

  <line x1="210" y1="195" x2="210" y2="232" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="195" x2="600" y2="232" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="990" y1="195" x2="990" y2="232" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="40" y="240" width="1120" height="115" rx="14" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <text x="62" y="268" fill="#10b981" font-family="Consolas, monospace" font-size="14" font-weight="800">SINGLE LIVE LOCAL ENGINE (token_economy/daemon.py — Protected Core)</text>
  <text x="62" y="293" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13">• <tspan fill="#38bdf8" font-weight="700">Deterministic Muscle:</tspan> AST repo_map • read_range • fuzzy SEARCH/REPLACE • checkpoint • RTK log distiller</text>
  <text x="62" y="315" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13">• <tspan fill="#10b981" font-weight="700">Non-AI Verifier:</tspan> py_compile / node --check / pytest → Auto-fixes 2× locally on failure (0 cloud tokens)</text>
  <text x="62" y="337" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13">• <tspan fill="#f59e0b" font-weight="700">6-Layer Context Shield:</tspan> keep_alive lock • 100% GPU pinned num_ctx • KV prefix cache • 70% compaction</text>
  <line x1="600" y1="355" x2="600" y2="385" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="40" y="392" width="1120" height="58" rx="12" fill="#0b1320" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="65" y="426" fill="#38bdf8" font-family="Consolas, monospace" font-size="14" font-weight="800">APPRENTICE HAND — LOCAL OLLAMA POOL (100% GPU):</text>
  <text x="465" y="426" fill="#10b981" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen3.5:4b (16K • 71 tok/s)</text>
  <text x="695" y="426" fill="#f8fafc" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen2.5-coder:7b (16K • 52.5 tok/s)</text>
  <text x="965" y="426" fill="#c084fc" font-family="Consolas, monospace" font-size="13" font-weight="700">qwen3.5:9b (8K • 44 tok/s)</text>
</svg>
